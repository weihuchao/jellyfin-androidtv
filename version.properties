# Custom version of the build, used as the Gradle property "jellyfin.version".
#
# Format: 0.20.0-seamless-vX.Y.Z
#   0.20.0  upstream baseline
#   vX.Y    main version, changes with a new requirement (one section of SPEC.md)
#   Z       patch number, goes up with every change
#
# A change that belongs to an older requirement still goes to the newest version.
# Override for a one-off build with -Pjellyfin.version=... or JELLYFIN_VERSION=...
#
# The rules are written down in SPEC.md, in the section of the v0.8 requirement.
#
# Keep this file ASCII only, properties files are read as ISO-8859-1 by many tools
# and would show garbled text.
jellyfin.version=0.20.0-seamless-v0.9
